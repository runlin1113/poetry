<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c100d">
  <title>送你一片花海 · 春日山谷</title>
  <meta name="description" content="第一人称漫步春日山谷花海。每一朵花都替你翻开一首来自凌润林《诗季》的诗。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23151b15'/%3E%3Cg fill='none' stroke='%23f3d9c2' stroke-width='2'%3E%3Cpath d='M32 36c-9-2-14-10-10-16 4-5 11-2 12 7 2-9 9-11 12-6 4 6-1 13-10 15z'/%3E%3Ccircle cx='32' cy='38' r='4'/%3E%3Cpath d='M32 43v10'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Keep a failed WebGL boot from leaving only a dark screen behind.
    window.addEventListener("error", function () {
      var error = document.getElementById("error");
      if (!document.body || document.body.classList.contains("is-ready")) return;
      if (error) error.hidden = false;
    });
  </script>
</head>
<body>
  <canvas id="world" aria-label="春日山谷花海。轻触任意花朵，阅读一首诗。"></canvas>

  <a class="back" href="../index.html" aria-label="回到诗季">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5" /></svg>
    <span>诗季</span>
  </a>

  <div class="site-mark" aria-hidden="true">
    <span class="site-mark__cn">送你一片花海</span>
    <span class="site-mark__sep"></span>
    <span class="site-mark__sub">春日山谷 · 凌润林诗选</span>
  </div>

  <div class="hint" id="hint" aria-hidden="true">
    <span class="hint__line"></span>
    <span class="hint__text">轻触一朵花，读一首诗</span>
    <span class="hint__line"></span>
  </div>

  <div class="intro" id="intro" aria-hidden="true">
    <span class="intro__eyebrow">诗 季 · 春 日 选 读</span>
    <h1 class="intro__title">送你一片花海</h1>
    <p class="intro__sub">每一朵花，都替你翻开一首诗</p>
  </div>

  <section class="poem" id="poem" aria-hidden="true">
    <div class="poem__veil" data-close></div>
    <div class="poem__stage">
      <article class="poem__card" id="poemCard" role="dialog" aria-modal="true" aria-labelledby="poemTitle" tabindex="-1">
        <aside class="poem__aside" aria-hidden="true">
          <span class="poem__index" id="poemIndex">01</span>
          <div class="poem__flowerblock">
            <span class="poem__flower" id="poemFlower">樱花</span>
            <span class="poem__latin" id="poemLatin">PRUNUS SERRULATA</span>
          </div>
          <span class="poem__seal" id="poemSeal">樱</span>
        </aside>
        <div class="poem__content" id="poemContent">
          <div class="poem__head">
            <p class="poem__kicker" id="poemKicker">春笺 · 第 01 首</p>
            <h2 class="poem__title" id="poemTitle">夏日舞曲</h2>
            <p class="poem__source" id="poemSource">凌润林 ·《诗季》· 卷一「夏」</p>
          </div>
          <div class="poem__rule" aria-hidden="true"><i></i></div>
          <div class="poem__body" id="poemBody"></div>
        </div>
        <div class="poem__scrollhint" id="poemScrollHint" aria-hidden="true">
          <span>继续读</span><i></i>
        </div>
        <button class="poem__close" id="poemClose" type="button" aria-label="合上诗页">
          <span></span><span></span>
        </button>
        <div class="poem__grain" aria-hidden="true"></div>
      </article>
      <p class="poem__dismiss">轻触空白处 · 合上诗页</p>
    </div>
  </section>

  <div class="sr-only">
    <p>花海中的每一朵花都替你翻开一首来自《诗季》的诗。你也可以从下方按标题打开任意一首。</p>
    <div id="poemNav"></div>
  </div>

  <div class="error" id="error" role="alert" hidden>
    <p class="error__title">这片花海需要一点光</p>
    <p class="error__text">请使用支持 WebGL 的浏览器打开，或刷新页面再试一次。</p>
  </div>

  <noscript>
    <div class="error">
      <p class="error__title">请开启 JavaScript</p>
      <p class="error__text">花海与诗句需要 JavaScript 才能与你相遇。</p>
    </div>
  </noscript>

  <script src="three.min.js"></script>
  <script src="poems.js"></script>
  <script src="app.js"></script>
</body>
</html>
